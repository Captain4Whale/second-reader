<!doctype html>
<html lang="zh-CN" translate="no">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Q1 · 批注细读</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #232e29;
      --muted: #59675d;
      --line: #d8ddd5;
      --paper: #fffefa;
      --green: #235d46;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #f4f5ef;
      color: var(--ink);
      font:
        16px/1.55 -apple-system,
        BlinkMacSystemFont,
        "PingFang SC",
        sans-serif;
    }
    header,
    main,
    #message {
      max-width: 1220px;
      margin: auto;
      padding: 16px 24px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--line);
    }
    h1 {
      font:
        600 21px/1.3 Georgia,
        serif;
      margin: 0;
    }
    h2 {
      font-size: 18px;
      margin: 0 0 10px;
    }
    h3 {
      font-size: 15px;
      margin: 15px 0 6px;
    }
    p {
      margin: 0.6em 0;
    }
    button,
    .pick,
    textarea {
      font: inherit;
      color: inherit;
    }
    button,
    .pick {
      background: white;
      border: 1px solid #b2beb3;
      border-radius: 6px;
      padding: 5px 11px;
      cursor: pointer;
    }
    button:hover,
    .pick:hover {
      border-color: var(--green);
    }
    button[aria-pressed="true"],
    button.primary {
      background: var(--green);
      color: white;
    }
    button:disabled {
      opacity: 0.45;
      cursor: default;
    }
    button:focus-visible,
    textarea:focus-visible,
    summary:focus-visible,
    .pick:focus-within {
      outline: 3px solid #4586af;
      outline-offset: 2px;
    }
    textarea {
      width: 100%;
      min-height: 60px;
      resize: vertical;
      padding: 7px;
      border: 1px solid #aebaad;
      border-radius: 6px;
      background: white;
    }
    label.field {
      display: block;
      font-size: 14px;
      margin: 9px 0 3px;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
    }
    small,
    .muted,
    summary {
      color: var(--muted);
    }
    #message:empty {
      display: none;
    }
    #message {
      color: #853d24;
      font-weight: 600;
    }
    #landing {
      max-width: 620px;
      margin: 12vh auto;
      background: var(--paper);
      padding: 32px;
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    .pick {
      display: inline-block;
      position: relative;
    }
    .pick input {
      position: absolute;
      inset: 0;
      width: 100%;
      opacity: 0;
      cursor: pointer;
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(300px, 390px);
      gap: 20px;
      align-items: start;
    }
    article,
    .panel {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 20px;
    }
    .panel {
      position: sticky;
      top: 12px;
      max-height: calc(100vh - 24px);
      overflow: auto;
    }
    #progress {
      margin-bottom: 14px;
    }
    #source,
    .context {
      font:
        19px/1.9 Georgia,
        "Songti SC",
        serif;
      overflow-wrap: anywhere;
    }
    #source p,
    .context p {
      white-space: pre-wrap;
    }
    .context {
      font-size: 16px;
      color: var(--muted);
    }
    .context:empty {
      display: none;
    }
    hr {
      border: 0;
      border-top: 1px solid var(--line);
      margin: 16px 0;
    }
    mark {
      background: #f3e7ab;
      color: inherit;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }
    mark.active {
      background: #f5d879;
      border-color: #927027;
    }
    .note {
      margin: 8px 0 20px 24px;
      padding: 4px 12px;
      border-left: 3px solid #94ab90;
      font:
        15px/1.65 -apple-system,
        BlinkMacSystemFont,
        sans-serif;
      color: #35523e;
      white-space: pre-wrap;
      cursor: pointer;
    }
    blockquote {
      font-family: Georgia, "Songti SC", serif;
      margin: 8px 0;
      background: #f2f3ea;
      padding: 7px 12px;
      max-height: 7em;
      overflow: auto;
      white-space: pre-wrap;
    }
    #selection {
      position: sticky;
      bottom: 10px;
      display: block;
      margin: 8px auto;
      box-shadow: 0 2px 10px #bbb;
    }
    .hint {
      font-size: 13px;
      color: var(--muted);
    }
    #saveState {
      font-size: 13px;
    }
    summary {
      cursor: pointer;
    }
    button,
    summary {
      touch-action: manipulation;
    }
    [hidden] {
      display: none !important;
    }
    @media (max-width: 820px) {
      header,
      main,
      #message {
        padding: 12px;
      }
      .layout {
        display: block;
      }
      .panel {
        position: static;
        max-height: none;
        margin-top: 12px;
      }
      article,
      .panel {
        padding: 14px;
      }
    }
  </style>
  <header>
    <h1>Second Reader · 批注细读</h1>
    <div class="row">
      <label class="pick">打开批次<input id="open" type="file" accept=".json" /></label
      ><button id="link" hidden>连接结果文件</button><button id="export" hidden>导出 JSONL</button
      ><span id="saveState" role="status"></span>
    </div>
  </header>
  <div id="message" role="alert"></div>
  <main>
    <section id="landing">
      <h2>开始一个批次</h2>
      <p>打开抽样生成的 batch.json，再连接同目录的 judgments.jsonl。理由和备注会按你的原话保存。</p>
    </section>
    <div id="work" hidden>
      <div id="progress"></div>
      <div class="layout">
        <article>
          <h2>单元原文</h2>
          <div id="before" class="context"></div>
          <hr />
          <div id="source"></div>
          <hr />
          <div id="after" class="context"></div>
          <button id="selection" class="primary" hidden>记为漏标</button>
        </article>
        <aside class="panel">
          <div class="row"><button id="prev">上一单元</button><button id="next">下一单元</button></div>
          <hr />
          <h2>条目判断</h2>
          <div class="row" id="tabs"></div>
          <div id="editor" hidden>
            <blockquote id="excerpt"></blockquote>
            <p id="activeNote" class="note" hidden></p>
            <div class="row"><button id="pass">过 P</button><button id="fail">不过 F</button></div>
            <label class="field" for="reason">理由 <small>不过时必填</small></label
            ><textarea id="reason" rows="2"></textarea>
            <div class="row">
              <label><input id="star" type="checkbox" /> 星标</label
              ><label><input id="verify" type="checkbox" /> 待核实</label>
            </div>
            <label class="field" for="memo">备注 <small>选填</small></label
            ><textarea id="memo" rows="1"></textarea> <button id="apply">保存并继续 ↵</button>
            <small id="draftState"></small>
          </div>
          <hr />
          <h2>单元判断</h2>
          <div class="row" id="density"><span>密度</span></div>
          <h3>漏标 <small id="missCount"></small></h3>
          <p class="hint">在本单元正文中划选，再点「记为漏标」。</p>
          <div id="misses"></div>
          <div id="missEditor" hidden>
            <blockquote id="missQuote"></blockquote>
            <label class="field" for="missReason">漏标理由</label><textarea id="missReason"></textarea>
            <div class="row">
              <button id="saveMiss">保存漏标</button><button id="cancelMiss">取消编辑</button>
            </div>
          </div>
        </aside>
      </div>
    </div>
  </main>
  <script>
    "use strict";
    const VERSION = "q1-annotator/1.0",
      $ = (id) => document.getElementById(id);
    const say = (text) => {
      $("message").textContent = text;
    };
    function el(tag, text, cls) {
      const n = document.createElement(tag);
      n.textContent = text;
      if (cls) n.className = cls;
      return n;
    }
    function button(text, fn) {
      const b = el("button", text);
      b.type = "button";
      b.onclick = fn;
      return b;
    }
    const cp = (s) => Array.from(s);
    const cut = (s, lo, hi) => cp(s).slice(lo, hi).join("");
    function sorted(value) {
      if (Array.isArray(value)) return value.map(sorted);
      if (value && typeof value === "object")
        return Object.fromEntries(
          Object.keys(value)
            .sort()
            .map((k) => [k, sorted(value[k])]),
        );
      return value;
    }
    async function checkBatch(b) {
      const { batch_id, ...payload } = b;
      if (b.schema !== "q1-batch/1" || !b.units?.length) throw Error("批次格式不支持");
      const bytes = new TextEncoder().encode(JSON.stringify(sorted(payload)));
      const hash = Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256", bytes)), (x) =>
        x.toString(16).padStart(2, "0"),
      ).join("");
      if (hash !== batch_id) throw Error("批次内容与指纹不一致，请重新打开抽样生成的文件。");
    }
    let db,
      session,
      selectedRange,
      busy = false;
    const baseMark = () => ({
      judgment: null,
      reason: "",
      star: false,
      needs_verification: false,
      remarks: "",
    });
    const unit = () => session.batch.units[session.state.ui];
    const item = () => unit().marginalia[session.state.mi];
    const latest = (type, id) =>
      session.state.rows.findLast((r) => r.record_type === type && r.record_id === id);
    function markValue(m) {
      return (
        session.state.drafts[m.marginalia_id] || latest("marginalia", m.marginalia_id) || baseMark()
      );
    }
    function dbGet(key) {
      return new Promise((ok, no) => {
        const req = db.transaction("data").objectStore("data").get(key);
        req.onsuccess = () => ok(req.result);
        req.onerror = () => no(req.error);
      });
    }
    function dbPut(key, value) {
      return new Promise((ok, no) => {
        const tx = db.transaction("data", "readwrite");
        tx.objectStore("data").put(value, key);
        tx.oncomplete = ok;
        tx.onabort = () => no(tx.error);
      });
    }
    function persist() {
      const s = session;
      return dbPut("state:" + s.batch.batch_id, s.state).catch((err) => {
        say("浏览器草稿保存失败，请立即导出。" + err.message);
      });
    }
    function fileStatus(s, text) {
      if (s === session) $("saveState").textContent = text;
    }
    function scheduleDisk(s = session) {
      if (s.handle) fileStatus(s, "正在同步文件…");
      s.writes = s.writes
        .then(async () => {
          if (!s.handle) {
            fileStatus(s, "仅存浏览器");
            return;
          }
          if ((await s.handle.queryPermission({ mode: "readwrite" })) !== "granted") {
            fileStatus(s, "仅存浏览器 · 请重新连接文件授权");
            return;
          }
          const rows = s.state.rows.slice();
          const journal = await (await s.handle.getFile()).text();
          const data = rows.map((r) => JSON.stringify(r) + "\n").join("");
          if (!data.startsWith(journal) || (journal && !journal.endsWith("\n")))
            throw Error("已有文件和本批历史不同，请连接对应文件。");
          if (journal.length < data.length) {
            const stream = await s.handle.createWritable({ keepExistingData: true, mode: "exclusive" });
            try {
              // Recheck after taking the writer lock, including writes by another reviewer.
              const current = await s.handle.getFile();
              if ((await current.text()) !== journal) throw Error("结果文件已被其他窗口修改。");
              await stream.seek(current.size);
              await stream.write(data.slice(journal.length));
              await stream.close();
            } catch (err) {
              await stream.abort().catch(() => {});
              throw err;
            }
          }
          if (rows.length === s.state.rows.length)
            fileStatus(s, "已写入文件 · " + rows.length + " 条记录");
        })
        .catch((err) => {
          fileStatus(s, "仅存浏览器 · 文件未同步");
          if (s === session) say(err.message);
        });
      return s.writes;
    }
    async function activate(batch) {
      if (session) await session.writes;
      await checkBatch(batch);
      const id = batch.batch_id;
      const state = (await dbGet("state:" + id)) || {
        ui: 0,
        mi: 0,
        rows: [],
        drafts: {},
        missDrafts: {},
      };
      session = { batch, state, handle: await dbGet("file:" + id), writes: Promise.resolve() };
      await dbPut("batch:" + id, batch);
      await dbPut("last", id);
      $("work").hidden = false;
      $("landing").hidden = true;
      $("export").hidden = false;
      $("link").hidden = !window.showOpenFilePicker;
      say("");
      render();
      scheduleDisk();
    }
    async function connect() {
      if (busy) return;
      busy = true;
      $("open").disabled = true;
      $("link").disabled = true;
      const s = session;
      try {
        let h = s.handle;
        if (!h || (await h.queryPermission({ mode: "readwrite" })) !== "prompt") {
          [h] = await showOpenFilePicker({
            id: "q1-journal",
            types: [{ description: "标注记录 JSONL", accept: { "text/plain": [".jsonl"] } }],
          });
        }
        if (!h.name.toLowerCase().endsWith(".jsonl")) throw Error("请选择本批次的 JSONL 结果文件。");
        if ((await h.requestPermission({ mode: "readwrite" })) !== "granted")
          throw Error("未获得写入权限。");
        await s.writes;
        const data = await (await h.getFile()).text();
        const local = s.state.rows.map((r) => JSON.stringify(r) + "\n").join("");
        if (data && (!data.endsWith("\n") || (!local.startsWith(data) && !data.startsWith(local))))
          throw Error("此文件与当前标注历史不一致。");
        if (data.length > local.length) {
          const rows = data.trimEnd().split("\n").map(JSON.parse);
          if (
            rows.some(
              (r, i) =>
                r.batch_id !== s.batch.batch_id ||
                r.revision !== i + 1 ||
                r.annotator_version !== VERSION,
            )
          )
            throw Error("结果文件属于其他批次或版本。");
          s.state.rows = rows;
          await persist();
        }
        await dbPut("file:" + s.batch.batch_id, h);
        s.handle = h;
        say("");
        render();
        await scheduleDisk(s);
      } catch (err) {
        if (err.name !== "AbortError") say(err.message);
      } finally {
        busy = false;
        $("open").disabled = false;
        $("link").disabled = false;
      }
    }
    function record(type, id, fields, span, original) {
      const s = session,
        b = s.batch,
        u = unit();
      s.state.rows.push({
        annotator_version: VERSION,
        batch_id: b.batch_id,
        book: b.book,
        run_id: b.run_id,
        reading_id: b.reading_id,
        product_sha256: b.product_sha256,
        product_source: b.product_source,
        original_epub_sha256: b.original_epub_sha256,
        original_substrate_sha256: b.original_substrate_sha256,
        unit_id: u.unit_id,
        record_type: type,
        record_id: id,
        revision: s.state.rows.length + 1,
        timestamp: new Date().toISOString(),
        marginalia_id: null,
        type: null,
        judgment: null,
        reason: null,
        star: null,
        needs_verification: null,
        remarks: null,
        source_range: span,
        original_source_range: original,
        ...fields,
      });
      persist();
      scheduleDisk();
    }
    function activeMisses(u) {
      const byId = new Map();
      for (const r of session.state.rows)
        if (r.unit_id === u.unit_id && r.record_type === "omission") byId.set(r.record_id, r);
      return [...byId.values()].filter((r) => r.action !== "remove");
    }
    function progress() {
      const { batch: b, state } = session;
      const judged = (m) =>
        !!latest("marginalia", m.marginalia_id)?.judgment && !state.drafts[m.marginalia_id];
      const done = b.units.filter(
        (u) =>
          latest("density", u.unit_id) && u.marginalia.every(judged) && !state.missDrafts[u.unit_id],
      ).length;
      const marks = b.units.flatMap((u) => u.marginalia);
      const current = item();
      $("draftState").textContent = current && state.drafts[current.marginalia_id] ? "未确认草稿" : "";
      $("progress").textContent =
        "批次 " +
        b.batch_number +
        " / " +
        b.batch_count +
        "　·　当前单元 " +
        (state.ui + 1) +
        " / " +
        b.units.length +
        "　·　已完成 " +
        done +
        " 个单元　·　已判 " +
        marks.filter(judged).length +
        " / " +
        marks.length +
        " 条";
    }
    function contextBox(id, parts) {
      const box = $(id);
      box.replaceChildren();
      if (!parts.length) return;
      const before = id === "before",
        rest = before ? parts.slice(0, -1) : parts.slice(1);
      box.append(el("small", before ? "上文" : "下文"), el("p", before ? parts.at(-1) : parts[0]));
      if (rest.length) {
        const more = el("details", "");
        more.append(el("summary", before ? "更早的上文" : "更多下文"), ...rest.map((p) => el("p", p)));
        if (before) box.insertBefore(more, box.children[1]);
        else box.append(more);
      }
    }
    function source() {
      const u = unit(),
        host = $("source");
      host.replaceChildren();
      contextBox("before", u.before);
      contextBox("after", u.after);
      for (const p of u.paragraphs) {
        const n = el("p", "");
        n.dataset.index = p.index;
        n.dataset.offset = p.offset;
        const end = p.offset + cp(p.text).length,
          boundaries = new Set([p.offset, end]),
          spans = [];
        u.marginalia.forEach((m, i) => {
          const { start: a, end: z } = m.original_source_range;
          if (p.index < a.paragraph_index || p.index > z.paragraph_index) return;
          const lo = p.index === a.paragraph_index ? a.char_offset : p.offset,
            hi = p.index === z.paragraph_index ? z.char_offset : end;
          boundaries.add(lo);
          boundaries.add(hi);
          spans.push({ lo, hi, i });
        });
        const points = [...boundaries].sort((a, b) => a - b);
        for (let k = 1; k < points.length; k++) {
          const left = points[k - 1],
            right = points[k],
            text = cut(p.text, left - p.offset, right - p.offset);
          const ids = spans.filter((s) => s.lo <= left && right <= s.hi).map((s) => s.i);
          if (!ids.length) {
            n.append(text);
            continue;
          }
          const tag = el("mark", text);
          tag.dataset.items = ids.join(",");
          tag.onclick = () => {
            if (!getSelection().isCollapsed) return;
            chooseMark(ids[(ids.indexOf(session.state.mi) + 1) % ids.length], false);
          };
          n.append(tag);
        }
        host.append(n);
        u.marginalia.forEach((m, i) => {
          if (m.type === "N" && m.original_source_range.end.paragraph_index === p.index) {
            const note = el("div", "旁注 " + (i + 1) + "　" + m.body_text, "note");
            note.onclick = () => {
              if (getSelection().isCollapsed) chooseMark(i, false);
            };
            host.append(note);
          }
        });
      }
    }
    function editor() {
      const m = item(),
        tabs = $("tabs");
      tabs.replaceChildren();
      unit().marginalia.forEach((v, i) => {
        const b = button(i + 1 + " · " + (v.type === "H" ? "高亮" : "旁注"), () => chooseMark(i, true));
        b.setAttribute("aria-pressed", i === session.state.mi);
        tabs.append(b);
      });
      for (const n of $("source").querySelectorAll("mark"))
        n.classList.toggle("active", n.dataset.items.split(",").includes(String(session.state.mi)));
      $("editor").hidden = !m;
      if (!m) {
        tabs.textContent = "本单元没有批注";
        return;
      }
      const v = markValue(m);
      $("excerpt").textContent = m.source_quote;
      $("activeNote").hidden = m.type !== "N";
      $("activeNote").textContent = m.body_text || "";
      $("reason").value = v.reason;
      $("memo").value = v.remarks;
      $("star").checked = v.star;
      $("verify").checked = v.needs_verification;
      $("pass").setAttribute("aria-pressed", v.judgment === "pass");
      $("fail").setAttribute("aria-pressed", v.judgment === "fail");
    }
    function renderMiss() {
      const u = unit(),
        list = activeMisses(u),
        d = session.state.missDrafts[u.unit_id];
      $("misses").replaceChildren();
      $("missCount").textContent = list.length + " / 2";
      for (const r of list) {
        const row = el("div", "");
        row.append(
          el("blockquote", r.source_quote),
          el("p", r.reason),
          button("编辑", () => {
            if (d) {
              say("请先保存或取消正在编辑的漏标。");
              return;
            }
            session.state.missDrafts[u.unit_id] = { ...r };
            persist();
            renderMiss();
            $("missReason").focus();
          }),
          button("撤回", () => {
            if (d) {
              say("请先保存或取消正在编辑的漏标。");
              return;
            }
            record(
              "omission",
              r.record_id,
              { action: "remove", reason: r.reason, source_quote: r.source_quote },
              r.source_range,
              r.original_source_range,
            );
            renderMiss();
            progress();
          }),
        );
        $("misses").append(row);
      }
      $("missEditor").hidden = !d;
      if (d) {
        $("missQuote").textContent = d.source_quote;
        $("missReason").value = d.reason;
      }
    }
    function render() {
      selectedRange = null;
      $("selection").hidden = true;
      $("prev").disabled = session.state.ui === 0;
      $("next").disabled = session.state.ui === session.batch.units.length - 1;
      source();
      editor();
      progress();
      renderMiss();
      for (const b of $("density").querySelectorAll("button"))
        b.setAttribute("aria-pressed", b.textContent === latest("density", unit().unit_id)?.density);
    }
    function chooseMark(i, scroll) {
      session.state.mi = i;
      persist();
      editor();
      progress();
      if (scroll) $("source").querySelector("mark.active")?.scrollIntoView({ block: "nearest" });
    }
    function moveUnit(delta) {
      const i = session.state.ui + delta;
      if (!session.batch.units[i]) return;
      session.state.ui = i;
      session.state.mi = 0;
      persist();
      say("");
      render();
      window.scrollTo(0, 0);
    }
    function draft(fields) {
      const m = item(),
        v = markValue(m);
      session.state.drafts[m.marginalia_id] = {
        judgment: v.judgment,
        reason: v.reason,
        star: v.star,
        needs_verification: v.needs_verification,
        remarks: v.remarks,
        ...fields,
      };
      persist();
      progress();
    }
    function saveMark(next) {
      const m = item(),
        v = markValue(m);
      if (v.judgment === "fail" && !v.reason.trim()) {
        say("请写一句不过的理由。");
        $("reason").focus();
        return false;
      }
      if (next && !v.judgment) {
        say("请先选择过或不过。");
        return false;
      }
      const fields = {
        marginalia_id: m.marginalia_id,
        type: m.type,
        source_quote: m.source_quote,
        body_text: m.body_text,
        judgment: v.judgment,
        reason: v.reason,
        star: v.star,
        needs_verification: v.needs_verification,
        remarks: v.remarks,
      };
      const prior = latest("marginalia", m.marginalia_id);
      delete session.state.drafts[m.marginalia_id];
      if (!prior || Object.keys(fields).some((k) => fields[k] !== prior[k]))
        record("marginalia", m.marginalia_id, fields, m.source_range, m.original_source_range);
      else persist();
      say("");
      progress();
      editor();
      if (next && session.state.mi + 1 < unit().marginalia.length) {
        chooseMark(session.state.mi + 1, true);
        $("pass").focus({ preventScroll: true });
      } else if (next) $("density").querySelector("button").focus();
      return true;
    }
    $("pass").onclick = () => {
      draft({ judgment: "pass" });
      saveMark(true);
    };
    $("fail").onclick = () => {
      draft({ judgment: "fail" });
      editor();
      $("reason").focus();
    };
    $("apply").onclick = () => saveMark(true);
    $("reason").oninput = () => draft({ reason: $("reason").value });
    $("memo").oninput = () => draft({ remarks: $("memo").value });
    function toggleFlag(key, value) {
      const m = item(),
        id = m.marginalia_id,
        prior = latest("marginalia", id) || baseMark();
      const pending = session.state.drafts[id];
      if (pending) pending[key] = value;
      const flags = { star: prior.star, needs_verification: prior.needs_verification, [key]: value };
      record(
        "marginalia",
        id,
        {
          marginalia_id: id,
          type: m.type,
          source_quote: m.source_quote,
          body_text: m.body_text,
          judgment: prior.judgment,
          reason: prior.reason,
          remarks: prior.remarks,
          ...flags,
        },
        m.source_range,
        m.original_source_range,
      );
      progress();
    }
    $("star").onchange = () => toggleFlag("star", $("star").checked);
    $("verify").onchange = () => toggleFlag("needs_verification", $("verify").checked);
    for (const name of ["多", "合适", "少"]) {
      const b = button(name, () => {
        const u = unit();
        if (latest("density", u.unit_id)?.density !== name)
          record("density", u.unit_id, { density: name }, u.source_range, u.original_source_range);
        for (const other of $("density").querySelectorAll("button"))
          other.setAttribute("aria-pressed", other === b);
        progress();
      });
      $("density").append(b);
    }
    $("prev").onclick = () => moveUnit(-1);
    $("next").onclick = () => moveUnit(1);
    function endpoint(node, offset) {
      const p = (node.nodeType === 1 ? node : node.parentElement)?.closest("#source p[data-index]");
      if (!p) return null;
      const r = document.createRange();
      r.selectNodeContents(p);
      r.setEnd(node, offset);
      const prefix = r.toString(),
        local = prefix.length;
      if (
        local < p.textContent.length &&
        new Intl.Segmenter().segment(p.textContent).containing(local).index !== local
      )
        return null;
      return {
        chapter_id: unit().original_source_range.start.chapter_id,
        paragraph_index: Number(p.dataset.index),
        char_offset: Number(p.dataset.offset) + cp(prefix).length,
      };
    }
    function selection() {
      const s = getSelection();
      if (!s.rangeCount || s.isCollapsed) return null;
      const r = s.getRangeAt(0),
        start = endpoint(r.startContainer, r.startOffset),
        end = endpoint(r.endContainer, r.endOffset);
      if (!start || !end) return null;
      const pieces = unit().paragraphs.filter(
        (p) => p.index >= start.paragraph_index && p.index <= end.paragraph_index,
      );
      const quote = pieces
        .map((p) =>
          cut(
            p.text,
            p.index === start.paragraph_index ? start.char_offset - p.offset : 0,
            p.index === end.paragraph_index ? end.char_offset - p.offset : undefined,
          ),
        )
        .filter(Boolean)
        .join("\n\n");
      if (!quote.trim() || new Set(pieces.map((p) => p.href)).size !== 1) return null;
      const ch = unit().source_range.start.chapter_id;
      return {
        original_source_range: { start, end },
        source_range: { start: { ...start, chapter_id: ch }, end: { ...end, chapter_id: ch } },
        source_quote: quote,
      };
    }
    document.addEventListener("selectionchange", () => {
      if (!session) return;
      selectedRange = selection();
      $("selection").hidden =
        !selectedRange || !!session.state.missDrafts[unit().unit_id] || activeMisses(unit()).length >= 2;
    });
    $("selection").onmousedown = (e) => e.preventDefault();
    $("selection").onclick = () => {
      if (!selectedRange || activeMisses(unit()).length >= 2 || session.state.missDrafts[unit().unit_id])
        return;
      session.state.missDrafts[unit().unit_id] = {
        ...selectedRange,
        record_id: crypto.randomUUID(),
        reason: "",
      };
      getSelection().removeAllRanges();
      persist();
      renderMiss();
      progress();
      $("missReason").focus();
    };
    $("missReason").oninput = () => {
      session.state.missDrafts[unit().unit_id].reason = $("missReason").value;
      persist();
    };
    $("saveMiss").onclick = () => {
      const d = session.state.missDrafts[unit().unit_id];
      if (!d.reason.trim()) {
        say("请写一句漏标理由。");
        $("missReason").focus();
        return;
      }
      delete session.state.missDrafts[unit().unit_id];
      record(
        "omission",
        d.record_id,
        { action: "save", reason: d.reason, source_quote: d.source_quote },
        d.source_range,
        d.original_source_range,
      );
      say("");
      renderMiss();
      progress();
    };
    $("cancelMiss").onclick = () => {
      delete session.state.missDrafts[unit().unit_id];
      persist();
      renderMiss();
      progress();
    };
    document.addEventListener("keydown", (e) => {
      if (
        !session ||
        e.isComposing ||
        e.keyCode === 229 ||
        e.repeat ||
        e.altKey ||
        e.ctrlKey ||
        e.metaKey ||
        e.shiftKey
      )
        return;
      if (e.target.tagName === "TEXTAREA") {
        if (e.key === "Enter") {
          e.preventDefault();
          if (e.target === $("missReason")) $("saveMiss").click();
          else saveMark(true);
        }
        return;
      }
      if (e.target.tagName === "INPUT" && e.target.type !== "checkbox") return;
      const k = e.key.toLowerCase();
      if (item() && (k === "p" || k === "f")) {
        e.preventDefault();
        $(k === "p" ? "pass" : "fail").click();
      }
      if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
        e.preventDefault();
        moveUnit(e.key === "ArrowLeft" ? -1 : 1);
      }
    });
    $("open").onchange = async (e) => {
      const file = e.target.files[0];
      if (!file || busy) return;
      busy = true;
      try {
        await activate(JSON.parse(await file.text()));
      } catch (err) {
        say(err.message);
      } finally {
        e.target.value = "";
        busy = false;
      }
    };
    $("link").onclick = connect;
    $("export").onclick = () => {
      const rows = session.state.rows,
        url = URL.createObjectURL(
          new Blob(
            rows.map((r) => JSON.stringify(r) + "\n"),
            { type: "application/x-ndjson" },
          ),
        );
      const a = el("a", "");
      a.href = url;
      a.download = "q1-" + session.batch.batch_id.slice(0, 12) + ".jsonl";
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 30000);
    };
    async function start() {
      db = await new Promise((ok, no) => {
        const r = indexedDB.open("second-reader-q1-v1", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("data");
        r.onsuccess = () => ok(r.result);
        r.onerror = () => no(r.error);
      });
      const last = await dbGet("last");
      if (last) await activate(await dbGet("batch:" + last));
      $("open").disabled = false;
    }
    $("open").disabled = true;
    async function init() {
      if (!navigator.locks) {
        await start();
        return;
      }
      await navigator.locks.request("second-reader-q1-editor", { ifAvailable: true }, async (lock) => {
        if (!lock) {
          say("已有标注窗口打开。请在该窗口继续，或关闭后刷新这里。");
          return;
        }
        await start();
        await new Promise(() => {});
      });
    }
    init().catch((e) => say("无法打开本地草稿库。" + e.message));
  </script>
</html>
