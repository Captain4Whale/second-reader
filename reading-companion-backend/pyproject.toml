[project]
name = "reading-companion"
version = "0.1.0"
description = "阅读伴侣 Agent - 一个读得更多的共读者"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.3.0",
    "openai>=1.0.0",
    "instructor>=1.0.0",
    "tavily-python>=0.3.0",
    "pydantic>=2.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "websockets>=15.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "jsonschema[format-nongpl]>=4.23,<5",
    "socksio>=1.0.0",
    "ebooklib>=0.5",
    "regex==2026.2.28",
    "pymupdf>=1.23",
    "mobi>=0.3",
    "sqlite-vec>=0.1.6",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff==0.15.5",
    "datamodel-code-generator==0.74.0",
]
observability = [
    "arize-phoenix-otel==0.17.1",
    "openinference-instrumentation==0.1.57",
    "opentelemetry-api==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
