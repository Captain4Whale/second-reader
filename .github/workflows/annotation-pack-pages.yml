name: Contract Projection Check

on:
  pull_request:
    paths:
      - ".github/workflows/annotation-pack-pages.yml"
      - "contract/annotation-pack/**"
      - "contract/reading-product/**"
      - "scripts/build_annotation_pack_pages.py"
      - "scripts/build_contract_pages.py"
  push:
    branches:
      - main
      - codex/annotation-pack-v0
    paths:
      - ".github/workflows/annotation-pack-pages.yml"
      - "contract/annotation-pack/**"
      - "contract/reading-product/**"
      - "scripts/build_annotation_pack_pages.py"
      - "scripts/build_contract_pages.py"
  workflow_dispatch:

concurrency:
  group: contract-projection-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check Annotation Pack sub-projection
        run: python scripts/build_annotation_pack_pages.py --check
      - name: Check unified strict contract projection
        run: python scripts/build_contract_pages.py --check
