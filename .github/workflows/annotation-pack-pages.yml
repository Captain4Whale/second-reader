name: Annotation Pack Pages

on:
  pull_request:
    paths:
      - ".github/workflows/annotation-pack-pages.yml"
      - "contract/annotation-pack/**"
      - "scripts/build_annotation_pack_pages.py"
  push:
    branches:
      - main
      - codex/annotation-pack-v0
    paths:
      - ".github/workflows/annotation-pack-pages.yml"
      - "contract/annotation-pack/**"
      - "scripts/build_annotation_pack_pages.py"
  workflow_dispatch:

concurrency:
  group: annotation-pack-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check strict contract projection
        run: python scripts/build_annotation_pack_pages.py --check
      - name: Build allowlisted contract site
        run: python scripts/build_annotation_pack_pages.py --output-dir _site
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy contract site
        id: deployment
        uses: actions/deploy-pages@v4
